<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256" role="img" aria-label="2k_mars.svg local texture">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f59e63"/>
      <stop offset="0.42" stop-color="#a34f2e"/>
      <stop offset="1" stop-color="#3b1f19"/>
    </linearGradient>
    <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="5" seed="81" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0.55" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="overlay"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="256" fill="url(#g)" filter="url(#noise)"/>
  <circle cx="42" cy="18" r="45" fill="#fee2e2" opacity="0.62" filter="url(#soft)"/>
  <circle cx="464" cy="238" r="54" fill="#fee2e2" opacity="0.55" filter="url(#soft)"/>
  <circle cx="290" cy="125" r="120" fill="#7f1d1d" opacity="0.24" filter="url(#soft)"/>
</svg>
