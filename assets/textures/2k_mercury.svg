<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 256" width="512" height="256" role="img" aria-label="2k_mercury.svg local texture">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d1c4ad"/>
      <stop offset="0.42" stop-color="#7f7667"/>
      <stop offset="1" stop-color="#2c2b2a"/>
    </linearGradient>
    <filter id="noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="5" seed="21" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0.55" result="grain"/>
      <feBlend in="SourceGraphic" in2="grain" mode="overlay"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>
  <rect width="512" height="256" fill="url(#g)" filter="url(#noise)"/>
  <circle cx="90" cy="55" r="36" fill="#d6d3d1" opacity="0.32" filter="url(#soft)"/>
  <circle cx="250" cy="92" r="54" fill="#44403c" opacity="0.45" filter="url(#soft)"/>
  <circle cx="410" cy="180" r="38" fill="#a8a29e" opacity="0.28" filter="url(#soft)"/>
</svg>
